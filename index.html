<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot Weave</title>
<!-- Colour of the day: the same hue for everyone on the same date, a different one tomorrow. -->
<script>(()=>{const d=new Date();let x=Math.imul((d.getFullYear()*372+d.getMonth()*31+d.getDate())^0x9e3779b9,0x85ebca6b);x^=x>>>13;x=Math.imul(x,0xc2b2ae35);x^=x>>>16;document.documentElement.style.setProperty('--hue',(x>>>0)%360)})()</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="topbar"><span id="who"></span><button id="out" class="link" data-t="sign_out" hidden>Abmelden</button></div>
  <h1 data-t="app_name">Plot Weave</h1>
  <p data-t="tagline">Geschichten wandern durch einen Kreis von Schreibenden – Absatz für Absatz.</p>
</header>
<main>
  <form id="gate" hidden>
    <label for="sitepw" data-t="gate_label">Passwort</label>
    <input id="sitepw" type="password" required autocomplete="current-password">
    <button data-t="gate_button">Eintreten</button>
  </form>
  <form id="login" hidden>
    <label for="id" data-t="login_label">Benutzername</label>
    <input id="id" required pattern="[A-Za-z0-9_]{2,24}" title="2 bis 24 Buchstaben, Ziffern oder Unterstriche" autocomplete="username">
    <div id="adminrow" hidden><label for="adminpw">Admin-Passwort</label><input id="adminpw" type="password" autocomplete="current-password"></div>
    <button data-t="login_button">Weiter</button>
  </form>
  <section id="app" hidden>
    <div id="prompt"></div>
    <form id="form" hidden>
      <label for="text" id="textlabel">Dein Absatz</label>
      <textarea id="text" maxlength="500" rows="5" required></textarea>
      <div class="row"><span></span><span id="count" class="note">0/500</span></div>
      <button id="send">Zur Geschichte hinzufügen</button>
    </form>
  </section>
  <section id="admin" hidden>
    <h2>Verwaltung</h2>
    <details><summary>Seiteneinstellungen</summary><form id="site" class="fields"></form></details>
    <form id="newcircle" class="inline"><input id="cname" placeholder="Name des neuen Kreises" required maxlength="60"><button>Kreis erstellen</button></form>
    <div id="circlelist"></div>
  </section>
  <section id="finished" hidden>
    <h2 data-t="finished_heading">Abgeschlossene Geschichten</h2>
    <div id="done"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
